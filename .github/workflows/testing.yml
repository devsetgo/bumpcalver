name: Testing

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      max-parallel: 10
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14","3.13","3.12", "3.11", "3.10"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --use-deprecated=legacy-resolver
      - name: Test with pytest
        run: |
          pip install pytest
          pytest -n 2

  type-check:
    # Static check: doesn't depend on OS, and mypy's target [tool.mypy]
    # python_version is pinned in pyproject.toml, so a single run (rather
    # than the full OS/Python test matrix above) is sufficient.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --use-deprecated=legacy-resolver
      - name: Type-check with mypy
        run: mypy
