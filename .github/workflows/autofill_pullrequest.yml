name: Autofill PR title, labels, and description

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  openai-pr-metadata:
    runs-on: ubuntu-22.04

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Ensure release-drafter labels exist
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Kept in sync with the `type: *` labels in .github/release-drafter.yml —
          # those categorize the changelog and resolve the next version bump, but
          # nothing applies them to PRs automatically. --force makes this idempotent
          # (creates the label, or updates color/description if it already exists).
          gh label create "type: breaking"     --repo "$REPO" --color B60205 --description "Breaking change"   --force
          gh label create "type: feature"      --repo "$REPO" --color 0E8A16 --description "New feature"       --force
          gh label create "type: bug"          --repo "$REPO" --color D93F0B --description "Bug fix"           --force
          gh label create "type: maintenance"  --repo "$REPO" --color 5319E7 --description "Maintenance/chore" --force
          gh label create "type: docs"         --repo "$REPO" --color 0075CA --description "Documentation"     --force
          gh label create "type: dependencies" --repo "$REPO" --color 0366D6 --description "Dependency update" --force
          gh label create "type: security"     --repo "$REPO" --color B60205 --description "Security fix"      --force

      - name: Generate and set PR title and labels
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not set, skipping title/label generation."
            exit 0
          fi

          COMMITS=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json commits \
            --jq '[.commits[].messageHeadline] | join("\n")' \
            | head -20)

          SYSTEM_PROMPT='You generate a pull request title and labels from a list of commit messages. Respond with ONLY a JSON object shaped like: title (string) and labels (array of strings). title: a concise, descriptive PR title under 72 characters, no surrounding quote marks, no trailing punctuation, no leading "PR:" prefix. labels: choose the one or two most applicable entries from this exact fixed set, written verbatim, and no others: type: breaking, type: feature, type: bug, type: maintenance, type: docs, type: dependencies, type: security. Only choose type: breaking for changes that break backward compatibility.'

          # Built with jq instead of interpolating $COMMITS into a JSON string
          # literal by hand — commit messages come from whoever opened the PR,
          # so treat them as untrusted text that needs proper JSON escaping,
          # not just formatting convenience.
          REQUEST_BODY=$(jq -n \
            --arg model "gpt-4.1-2025-04-14" \
            --arg system "$SYSTEM_PROMPT" \
            --arg commits "$COMMITS" \
            '{
              model: $model,
              response_format: {type: "json_object"},
              messages: [
                {role: "system", content: $system},
                {role: "user", content: ("Commits in this pull request:\n" + $commits)}
              ],
              max_tokens: 200,
              temperature: 0.3
            }')

          CONTENT=$(curl -fsSL https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY" | jq -r '.choices[0].message.content // empty')

          if [ -z "$CONTENT" ]; then
            echo "No content returned from OpenAI, skipping title/label update."
            exit 0
          fi

          TITLE=$(echo "$CONTENT" | jq -r '.title // empty')
          if [ -n "$TITLE" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$TITLE"
          fi

          # Belt-and-suspenders: only ever apply labels from this fixed
          # allow-list, even though the prompt above already constrains the
          # model to it. Commit messages are untrusted input, so the model's
          # output derived from them is untrusted too.
          ALLOWED_LABELS=(
            "type: breaking"
            "type: feature"
            "type: bug"
            "type: maintenance"
            "type: docs"
            "type: dependencies"
            "type: security"
          )

          is_allowed_label() {
            local candidate="$1"
            for allowed in "${ALLOWED_LABELS[@]}"; do
              [ "$candidate" = "$allowed" ] && return 0
            done
            return 1
          }

          echo "$CONTENT" | jq -r '.labels[]? // empty' | while IFS= read -r LABEL; do
            if is_allowed_label "$LABEL"; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL" \
                || echo "Could not add label '$LABEL'."
            else
              echo "Skipping label not in the allowed set: $LABEL"
            fi
          done

      - name: Generate PR description
        continue-on-error: true
        uses: platisd/openai-pr-description@master
        with:
          github_token: ${{ github.token }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          max_tokens: 4096
          openai_model: gpt-4.1-2025-04-14
          overwrite_description: true
          temperature: 0.6
