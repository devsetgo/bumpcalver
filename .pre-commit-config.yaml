repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-toml
        exclude: ^(.git|node_modules|dist|build|coverage|examples|\.devcontainer|.*\.svg)/
      - id: check-yaml
        exclude: ^(.git|node_modules|dist|build|coverage|examples|\.devcontainer|.*\.svg)/
      - id: check-json
        exclude: ^(.git|node_modules|dist|build|coverage|examples|\.devcontainer|.*\.svg)/
      - id: check-xml
        exclude: ^(.git|node_modules|dist|build|coverage|examples|\.devcontainer|.*\.svg)/
      - id: end-of-file-fixer
        exclude: ^(.git|node_modules|dist|build|coverage|examples|\.devcontainer|.*\.svg)/
      - id: trailing-whitespace
        exclude: ^(.git|node_modules|dist|build|coverage|examples|\.devcontainer|.*\.svg)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match the `ruff` version in requirements.txt — the previous
    # v0.1.5 pin here was over four years stale relative to that, so this
    # hook had drifted from what `ruff`-the-CLI actually checks locally.
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
        exclude: ^(.git|node_modules|dist|build|coverage|examples|\.devcontainer|.*\.svg)/
      - id: ruff-format
        exclude: ^(.git|node_modules|dist|build|coverage|examples|\.devcontainer|.*\.svg)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-toml]
        files: ^src/bumpcalver/
